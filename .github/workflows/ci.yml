name: CI

# Проверка каждого pull request и main: зависимости ставятся, проект собирается
on:
  pull_request:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bunx prettier --check "src/**/*.{js,jsx,css,html}" "*.{js,json,md}"

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build
